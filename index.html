<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111512">
  <title>Playlog | Your game library</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eff3ee;
      --muted: #9ca69f;
      --dim: #68736b;
      --page: #111512;
      --surface: #191f1b;
      --surface-raised: #202722;
      --line: #303a33;
      --lime: #c2f36b;
      --lime-dark: #9dc94e;
      --coral: #ff886b;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 78% 4%, rgba(119, 155, 80, .12), transparent 34rem),
        linear-gradient(150deg, #151a16, #101411 62%);
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(17,21,18,.9);
    }

    .topbar-inner, .page-shell, .bottom-inner {
      width: min(1280px, calc(100% - 56px));
      margin: 0 auto;
    }

    .topbar-inner {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 9px 9px 9px 3px;
      background: var(--lime);
      color: #17200e;
      font-size: 17px;
      font-weight: 900;
      transform: rotate(-5deg);
    }

    .top-links { display: flex; gap: 24px; }
    .top-links button {
      border: 0;
      padding: 8px 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .top-links button:hover, .top-links button.active { color: var(--ink); }
    .top-links button.active { box-shadow: inset 0 -2px var(--lime); }

    .top-actions { display: flex; align-items: center; gap: 13px; margin-left: auto; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; top: 11px; left: 12px; color: var(--muted); }
    .search-input {
      width: 220px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px 0 38px;
      background: #171c18;
      color: var(--ink);
      font-size: 13px;
    }
    .search-input::placeholder { color: #7d877f; }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      padding: 3px 0 3px 3px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .avatar {
      display: grid;
      width: 35px;
      height: 35px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(194,243,107,.45);
      border-radius: 50%;
      background: #384530;
      color: var(--lime);
      font-size: 13px;
      font-weight: 800;
    }
    .profile-copy { display: grid; gap: 2px; }
    .profile-copy strong { max-width: 125px; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .profile-copy span { color: var(--muted); font-size: 10px; }

    .page-shell { padding: 42px 0 116px; }
    .welcome-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .welcome-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .eyebrow { color: var(--lime); font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin: 9px 0 8px; font-size: 32px; font-weight: 700; letter-spacing: 0; line-height: 1.15; }
    .welcome-row p { margin: 0; color: var(--muted); font-size: 13px; }
    .key-notice { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0 0 24px; border: 1px solid rgba(255,136,107,.35); border-left: 3px solid var(--coral); border-radius: 5px; padding: 14px 16px; background: rgba(255,136,107,.07); }
    .key-notice-copy { min-width: 0; }
    .key-notice h2 { margin: 0 0 5px; color: #ffc0ad; font-size: 13px; }
    .key-notice p { margin: 0; color: #c3c9c3; font-size: 11px; line-height: 1.55; }
    .key-notice .secondary-button { flex: 0 0 auto; }
    .connect-button, .primary-button {
      display: inline-flex;
      min-height: 39px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 5px;
      padding: 0 14px;
      background: var(--lime);
      color: #1d2616;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: background .16s ease, transform .16s ease;
    }
    .connect-button:hover, .primary-button:hover { background: #d2ff83; transform: translateY(-1px); }
    .secondary-button { display: inline-flex; min-height: 39px; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 5px; padding: 0 13px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 700; }
    .secondary-button:hover { border-color: var(--lime); color: var(--lime); }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(290px, .88fr); gap: 30px; align-items: start; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .section-heading h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .section-heading span { color: var(--muted); font-size: 11px; }
    .game-list { display: grid; }
    .game-row {
      display: grid;
      grid-template-columns: 32px 116px minmax(0,1fr) 68px;
      align-items: center;
      gap: 14px;
      min-height: 91px;
      border-bottom: 1px solid rgba(255,255,255,.065);
      animation: arrive .4s both;
    }
    .game-row:nth-child(2) { animation-delay: 35ms; }
    .game-row:nth-child(3) { animation-delay: 70ms; }
    .game-row:nth-child(4) { animation-delay: 105ms; }
    .game-row:nth-child(5) { animation-delay: 140ms; }
    .rank { color: #778178; font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
    .game-art {
      position: relative;
      width: 116px;
      height: 65px;
      overflow: hidden;
      border-radius: 4px;
      background: linear-gradient(135deg, #455a48, #26372f 55%, #79483c);
    }
    .game-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .game-info { min-width: 0; }
    .game-info h3 { overflow: hidden; margin: 0 0 8px; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .game-info p { margin: 0; color: var(--muted); font-size: 10px; }
    .playtime { text-align: right; }
    .playtime strong { display: block; color: var(--lime); font-size: 14px; font-variant-numeric: tabular-nums; }
    .playtime span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .empty-state { padding: 40px 10px; color: var(--muted); font-size: 13px; text-align: center; }

    .recommendation { overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .recommendation-art {
      position: relative;
      height: 190px;
      background-color: #45483a;
      background-position: center;
      background-size: cover;
    }
    .recommendation-art::after { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(10,14,11,.04),rgba(10,14,11,.9)); content: ""; }
    .match-pill { position: absolute; z-index: 1; top: 13px; left: 13px; border: 1px solid rgba(255,255,255,.22); border-radius: 20px; padding: 6px 9px; background: rgba(17,21,18,.74); color: var(--lime); font-size: 9px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
    .recommendation-copy { position: relative; z-index: 1; margin-top: -56px; padding: 0 17px 17px; }
    .recommendation-copy .eyebrow { font-size: 9px; }
    .recommendation-copy h2 { margin: 6px 0 7px; font-size: 21px; }
    .recommendation-copy p { min-height: 35px; margin: 0 0 15px; color: #c1c9c2; font-size: 11px; line-height: 1.55; }
    .recommendation-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 13px; }
    .price { color: var(--lime); font-size: 12px; font-weight: 800; }
    .store-link { border: 0; padding: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 11px; }
    .store-link:hover { color: var(--lime); }
    .below-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(290px, .88fr); gap: 30px; margin-top: 34px; }
    .stat-strip { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding-top: 16px; }
    .stat { border-left: 2px solid #536b43; padding-left: 11px; }
    .stat strong { display: block; font-size: 17px; }
    .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .note { margin: 13px 0 0; color: var(--dim); font-size: 10px; line-height: 1.5; }

    .view-content { min-height: 440px; animation: arrive .3s both; }
    .view-intro { margin-bottom: 23px; }
    .view-intro h2 { margin: 7px 0; font-size: 24px; }
    .view-intro p { margin: 0; color: var(--muted); font-size: 12px; }
    .discovery-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .discovery-card { overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .discovery-card img { display: block; width: 100%; aspect-ratio: 460 / 215; object-fit: cover; background: #313b32; }
    .discovery-card-body { padding: 12px; }
    .discovery-card h3 { margin: 0 0 6px; font-size: 13px; }
    .discovery-card p { min-height: 31px; margin: 0 0 12px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .discovery-card button { border: 0; padding: 0; background: transparent; color: var(--lime); cursor: pointer; font-size: 10px; font-weight: 700; }
    .collection-list, .activity-list { display: grid; max-width: 780px; }
    .collection-row, .activity-row { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); padding: 17px 0; }
    .collection-icon, .activity-icon { display: grid; width: 40px; height: 40px; flex: 0 0 auto; place-items: center; border-radius: 5px; background: #29342a; color: var(--lime); font-size: 16px; font-weight: 800; }
    .collection-row strong, .activity-row strong { display: block; margin-bottom: 4px; font-size: 12px; }
    .collection-row span, .activity-row span { color: var(--muted); font-size: 10px; }

    .bottom-nav { position: fixed; z-index: 5; right: 0; bottom: 0; left: 0; border-top: 1px solid rgba(255,255,255,.1); background: rgba(20,25,21,.96); backdrop-filter: blur(14px); }
    .bottom-inner { display: flex; height: 66px; align-items: center; justify-content: center; gap: clamp(25px, 7vw, 92px); }
    .nav-button { position: relative; display: flex; height: 100%; min-width: 76px; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: 0; padding: 0 8px; background: transparent; color: #849087; cursor: pointer; font-size: 9px; }
    .nav-button svg { width: 18px; height: 18px; }
    .nav-button:hover, .nav-button.active { color: var(--lime); }
    .nav-button.active::before { position: absolute; top: -1px; right: 15px; left: 15px; height: 2px; background: var(--lime); content: ""; }

    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(5,8,6,.76); backdrop-filter: blur(6px); }
    .modal { width: min(440px, 100%); border: 1px solid #39443b; border-radius: 8px; padding: 23px; background: #1b211c; box-shadow: 0 24px 80px rgba(0,0,0,.45); animation: arrive .2s both; }
    .modal-top { display: flex; align-items: start; justify-content: space-between; gap: 15px; }
    .modal h2 { margin: 6px 0 8px; font-size: 22px; }
    .modal p { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .close-button { border: 0; padding: 2px 5px; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
    .connect-form { display: grid; gap: 10px; margin-top: 19px; }
    .connect-form label { font-size: 11px; font-weight: 700; }
    .connect-form input { height: 43px; border: 1px solid var(--line); border-radius: 5px; padding: 0 12px; background: #111612; color: var(--ink); font-size: 12px; }
    .connect-form .primary-button { margin-top: 3px; }
    .form-message { min-height: 16px; margin: 0 !important; color: var(--coral) !important; font-size: 10px !important; }
    .privacy-note { margin: 16px 0 0 !important; border-top: 1px solid var(--line); padding-top: 13px; color: #849087 !important; font-size: 10px !important; }
    .hidden { display: none !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 800px) {
      .top-links { display: none; }
      .dashboard-grid, .below-grid { grid-template-columns: minmax(0, 1fr); }
      .recommendation { max-width: 560px; }
      .discovery-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .below-grid { margin-top: 26px; }
    }
    @media (max-width: 560px) {
      .topbar { height: auto; }
      .topbar-inner { width: calc(100% - 32px); min-height: 64px; flex-wrap: wrap; gap: 0; padding: 11px 0; }
      .brand { font-size: 16px; }
      .brand-mark { width: 29px; height: 29px; }
      .top-actions { gap: 8px; }
      .search-input { width: min(38vw, 170px); height: 35px; }
      .search-wrap svg { top: 9px; }
      .profile-copy { display: none; }
      .avatar { width: 33px; height: 33px; }
      .page-shell { width: calc(100% - 32px); padding-top: 29px; }
      .welcome-row { align-items: start; flex-direction: column; margin-bottom: 23px; }
      .welcome-actions { width: 100%; }
      .welcome-row h1 { font-size: 27px; }
      .connect-button, .secondary-button { min-height: 36px; }
      .key-notice { align-items: start; flex-direction: column; gap: 12px; margin-bottom: 20px; }
      .game-row { grid-template-columns: 23px 88px minmax(0,1fr) 55px; gap: 9px; min-height: 78px; }
      .game-art { width: 88px; height: 52px; }
      .game-info h3 { font-size: 11px; }
      .game-info p { font-size: 9px; }
      .playtime strong { font-size: 12px; }
      .playtime span { font-size: 9px; }
      .recommendation-art { height: 170px; }
      .discovery-grid { grid-template-columns: minmax(0,1fr); }
      .discovery-card { display: grid; grid-template-columns: 42% minmax(0,1fr); }
      .discovery-card img { height: 100%; aspect-ratio: auto; object-fit: cover; }
      .discovery-card p { min-height: 0; }
      .bottom-inner { width: 100%; height: 62px; justify-content: space-around; gap: 0; }
      .nav-button { min-width: 64px; font-size: 8px; }
      .stat-strip { gap: 5px; }
      .stat { padding-left: 8px; }
      .stat strong { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" type="button" data-view="library" aria-label="Playlog home">
        <span class="brand-mark">P</span><span>playlog</span>
      </button>
      <nav class="top-links" aria-label="Main navigation">
        <button class="active" type="button" data-view="library">Library</button>
        <button type="button" data-view="discover">Discover</button>
      </nav>
      <div class="top-actions">
        <label class="search-wrap" aria-label="Search your games">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
          <input id="gameSearch" class="search-input" type="search" placeholder="Search your games" autocomplete="off">
        </label>
        <button class="profile-button" id="profileButton" type="button" aria-label="Connect or manage Steam profile">
          <span class="avatar" id="avatar">M</span>
          <span class="profile-copy"><strong id="profileName">Morgan</strong><span id="profileStatus">Demo profile</span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div id="appContent"></div>
  </main>

  <nav class="bottom-nav" aria-label="App sections">
    <div class="bottom-inner">
      <button class="nav-button active" type="button" data-view="library" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v16H5.5A1.5 1.5 0 0 1 4 18.5z"></path><path d="M4 17h16M8 8h8M8 11h6"></path></svg>Library
      </button>
      <button class="nav-button" type="button" data-view="discover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"></circle><path d="m15.8 8.2-2.3 5.3-5.3 2.3 2.3-5.3z"></path></svg>Discover
      </button>
      <button class="nav-button" type="button" data-view="collections">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4zM8 9h8M8 12h8M8 15h5"></path></svg>Collections
      </button>
      <button class="nav-button" type="button" data-view="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l2.2-6 4.1 12 2.2-6H21"></path></svg>Activity
      </button>
    </div>
  </nav>

  <div id="modalRoot"></div>

  <script>
    const demoGames = [
      { appid: 1091500, name: 'Cyberpunk 2077', hours: 128.4, genre: 'rpg', detail: 'Last played yesterday', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1091500/header.jpg' },
      { appid: 1086940, name: "Baldur's Gate 3", hours: 94.2, genre: 'rpg', detail: 'Last played 3 days ago', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1086940/header.jpg' },
      { appid: 1245620, name: 'Elden Ring', hours: 72.8, genre: 'souls', detail: 'Last played last week', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1245620/header.jpg' },
      { appid: 1145360, name: 'Hades', hours: 61.1, genre: 'action', detail: 'Last played 2 weeks ago', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1145360/header.jpg' },
      { appid: 413150, name: 'Stardew Valley', hours: 48.6, genre: 'cozy', detail: 'Last played this month', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/413150/header.jpg' }
    ];

    const picks = [
      { appid: 377160, name: 'Fallout 4', genre: 'rpg', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/377160/header.jpg', reason: 'A huge open world, memorable characters, and room to make every run your own.', price: '$19.99' },
      { appid: 435150, name: 'Divinity: Original Sin 2', genre: 'rpg', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/435150/header.jpg', reason: 'Deep party-building and player-shaped stories for your next long RPG night.', price: '$44.99' },
      { appid: 588650, name: 'Dead Cells', genre: 'action', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/588650/header.jpg', reason: 'Fast, precise combat and a new route to learn on every run.', price: '$24.99' },
      { appid: 1144200, name: 'Ready or Not', genre: 'shooter', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1144200/header.jpg', reason: 'A tense, team-based tactical shooter built around planning and coordinated room clears.', price: '$49.99' },
      { appid: 387990, name: 'Scrap Mechanic', genre: 'sandbox', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/387990/header.jpg', reason: 'A playful building sandbox where your contraptions and experiments set the rules.', price: '$19.99' },
      { appid: 1167630, name: 'Teardown', genre: 'sandbox', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1167630/header.jpg', reason: 'A fully destructible sandbox built for creative plans and spectacular escapes.', price: '$29.99' },
      { appid: 255710, name: 'Cities: Skylines', genre: 'cozy', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/255710/header.jpg', reason: 'Build a place to get lost in, one neighborhood at a time.', price: '$29.99' },
      { appid: 433340, name: 'Slime Rancher', genre: 'cozy', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/433340/header.jpg', reason: 'A colorful, low-pressure world to explore and shape at your own pace.', price: '$19.99' },
      { appid: 632360, name: 'Risk of Rain 2', genre: 'action', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/632360/header.jpg', reason: 'Fast co-op runs that get wilder the longer you survive.', price: '$24.99' },
      { appid: 581320, name: 'Insurgency: Sandstorm', genre: 'shooter', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/581320/header.jpg', reason: 'A grounded squad shooter with deliberate, high-stakes firefights.', price: '$29.99' },
      { appid: 582010, name: 'Monster Hunter: World', genre: 'souls', image: 'https://cdn.cloudflare.steamstatic.com/steam/apps/582010/header.jpg', reason: 'A rewarding challenge, enormous creatures, and gear worth earning.', price: '$29.99' }
    ];

    let games = loadSavedGames() || demoGames;
    let profile = loadProfile();
    let currentView = 'library';
    let activePick = getRecommendation();

    function loadSavedGames() {
      try {
        const saved = JSON.parse(localStorage.getItem('playlog-games'));
        return Array.isArray(saved) && saved.length ? saved : null;
      } catch { return null; }
    }

    function loadProfile() {
      try { return JSON.parse(localStorage.getItem('playlog-profile')) || null; }
      catch { return null; }
    }

    function saveProfile() {
      try {
        localStorage.setItem('playlog-profile', JSON.stringify(profile));
        localStorage.setItem('playlog-games', JSON.stringify(games));
      } catch { /* Keep the connected session usable when storage is unavailable. */ }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function getGenre(game) {
      if (game.genre) return game.genre;
      const title = game.name.toLowerCase();
      if (/rainbow six|counter-strike|valorant|call of duty|battlefield|apex legends|helldivers/.test(title)) return 'shooter';
      if (/garry'?s mod|^gmod$|minecraft|rust|satisfactory|factorio|scrap mechanic|teardown|people playground/.test(title)) return 'sandbox';
      if (/elden ring|dark souls|sekiro|monster hunter/.test(title)) return 'souls';
      if (/stardew|cozy|simulator|cities: skylines|terraria/.test(title)) return 'cozy';
      if (/hades|doom|devil may cry|dead cells|counter-strike/.test(title)) return 'action';
      if (/cyberpunk|baldur|bauldur|witcher|fallout|elder scrolls|mass effect|dragon age/.test(title)) return 'rpg';
      return 'rpg';
    }

    function getRecommendation(previousAppId) {
      const topGame = [...games].sort((a, b) => b.hours - a.hours)[0] || demoGames[0];
      const genreHours = new Map();
      games.forEach(game => {
        const genre = getGenre(game);
        genreHours.set(genre, (genreHours.get(genre) || 0) + (Number(game.hours) || 0));
      });
      const genre = [...genreHours.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || getGenre(topGame);
      const options = picks.filter(pick => pick.genre === genre);
      const pick = options.find(option => option.appid !== previousAppId) || options[0] || picks[0];
      return { ...pick, topGame: topGame.name, genre };
    }

    function formatHours(hours) {
      const value = Number(hours) || 0;
      return `${value >= 100 ? Math.round(value) : value.toFixed(1)} hrs`;
    }

    function renderLibrary() {
      const sorted = [...games].sort((a, b) => b.hours - a.hours);
      const shown = sorted.slice(0, 5);
      const totalHours = games.reduce((total, game) => total + (Number(game.hours) || 0), 0);
      const gameRows = shown.map((game, index) => `
        <article class="game-row">
          <span class="rank">${String(index + 1).padStart(2, '0')}</span>
          <div class="game-art"><img src="${escapeHtml(game.image || `https://cdn.cloudflare.steamstatic.com/steam/apps/${game.appid}/header.jpg`)}" alt="${escapeHtml(game.name)} artwork" loading="lazy" onerror="this.style.display='none'"></div>
          <div class="game-info"><h3>${escapeHtml(game.name)}</h3><p>${escapeHtml(game.detail || 'In your Steam library')}</p></div>
          <div class="playtime"><strong>${formatHours(game.hours)}</strong><span>played</span></div>
        </article>`).join('');

      document.querySelector('#appContent').innerHTML = `
        <div class="welcome-row">
          <div><span class="eyebrow">YOUR LIBRARY, IN GOOD COMPANY</span><h1>Good evening, ${escapeHtml(profile?.name || 'Morgan')}.</h1><p>Your next favorite might be closer than you think.</p></div>
          <div class="welcome-actions"><button class="secondary-button" type="button" data-add-game>Add a game</button><button class="connect-button" type="button" data-connect><span aria-hidden="true">＋</span>${profile ? 'Manage Steam profile' : 'Connect Steam profile'}</button></div>
        </div>
        <aside class="key-notice" aria-labelledby="keyNoticeTitle">
          <div class="key-notice-copy"><h2 id="keyNoticeTitle">Some games require an APK Key</h2><p>Some games need an APK Key to be detected or added automatically, so they may not appear in your game list. Check the game's APK Key requirements before assuming it is unsupported. If it's missing, add it manually.</p></div>
          <button class="secondary-button" type="button" data-add-game>Add missing game</button>
        </aside>
        <div class="dashboard-grid">
          <section aria-labelledby="mostPlayedTitle">
            <div class="section-heading"><h2 id="mostPlayedTitle">Most played</h2><span>Ranked by hours</span></div>
            <div class="game-list" id="gameList">${gameRows || '<div class="empty-state">No games to show yet. Connect a public Steam profile to get started.</div>'}</div>
            <div class="empty-state hidden" id="searchEmpty">No games match that search.</div>
          </section>
          <aside class="recommendation" aria-label="Recommended game">
            <div class="recommendation-art" style="background-image:url('${escapeHtml(activePick.image)}')"><span class="match-pill">Picked for your play style</span></div>
            <div class="recommendation-copy"><span class="eyebrow">YOUR NEXT GAME</span><h2>${escapeHtml(activePick.name)}</h2><p>Because you put the most time into <strong>${escapeHtml(activePick.topGame)}</strong>. ${escapeHtml(activePick.reason)}</p>
              <div class="recommendation-footer"><span class="price">${escapeHtml(activePick.price)}</span><button class="store-link" type="button" data-store="${activePick.appid}">View on Steam ↗</button></div>
            </div>
          </aside>
        </div>
        <div class="below-grid">
          <section><div class="section-heading"><h2>Your playtime</h2><span>Across ${games.length} games</span></div><div class="stat-strip"><div class="stat"><strong>${games.length}</strong><span>Games played</span></div><div class="stat"><strong>${Math.round(totalHours).toLocaleString()}</strong><span>Total hours</span></div><div class="stat"><strong>${formatHours(sorted[0]?.hours || 0).replace(' hrs','')}</strong><span>Top game hours</span></div></div></section>
          <p class="note">${profile ? 'Showing most-played games from your public Steam profile.' : 'Sample library shown. Connect a public Steam profile to import its most-played games.'}</p>
        </div>`;
      applySearch();
    }

    function renderDiscover() {
      const topGame = [...games].sort((a, b) => b.hours - a.hours)[0] || demoGames[0];
      const genre = getGenre(topGame);
      const ordered = [...picks.filter(pick => pick.genre === genre), ...picks.filter(pick => pick.genre !== genre)];
      document.querySelector('#appContent').innerHTML = `
        <section class="view-content"><div class="view-intro"><span class="eyebrow">A GOOD NEXT SESSION</span><h2>Discover something new</h2><p>Starting with what you play most: <strong>${escapeHtml(topGame.name)}</strong></p></div>
        <div class="discovery-grid">${ordered.slice(0, 5).map(pick => `<article class="discovery-card"><img src="${escapeHtml(pick.image)}" alt="${escapeHtml(pick.name)} artwork" loading="lazy"><div class="discovery-card-body"><h3>${escapeHtml(pick.name)}</h3><p>${escapeHtml(pick.reason)}</p><button type="button" data-store="${pick.appid}">View on Steam ↗</button></div></article>`).join('')}</div></section>`;
    }

    function renderCollections() {
      const mostPlayed = [...games].sort((a, b) => b.hours - a.hours).slice(0, 3);
      document.querySelector('#appContent').innerHTML = `
        <section class="view-content"><div class="view-intro"><span class="eyebrow">YOUR SHELVES</span><h2>Collections</h2><p>A few ways into your library.</p></div>
        <div class="collection-list"><div class="collection-row"><div class="collection-icon">↗</div><div><strong>Most played</strong><span>${games.length} games ranked by time played</span></div></div><div class="collection-row"><div class="collection-icon">◷</div><div><strong>Quick sessions</strong><span>Short on time? Pick up ${escapeHtml(mostPlayed[3]?.name || 'a recent favorite')}</span></div></div><div class="collection-row"><div class="collection-icon">✦</div><div><strong>Comfort picks</strong><span>${escapeHtml(mostPlayed.find(game => getGenre(game) === 'cozy')?.name || 'A few familiar worlds')}</span></div></div></div></section>`;
    }

    function renderActivity() {
      const sorted = [...games].sort((a, b) => b.hours - a.hours).slice(0, 4);
      document.querySelector('#appContent').innerHTML = `
        <section class="view-content"><div class="view-intro"><span class="eyebrow">YOUR RECENT ROTATION</span><h2>Activity</h2><p>The games taking up space in your recent history.</p></div>
        <div class="activity-list">${sorted.map(game => `<div class="activity-row"><div class="activity-icon">◷</div><div><strong>${escapeHtml(game.name)}</strong><span>${escapeHtml(game.detail || 'In your library')} · ${formatHours(game.hours)} total</span></div></div>`).join('')}</div></section>`;
    }

    function render() {
      if (currentView === 'discover') renderDiscover();
      else if (currentView === 'collections') renderCollections();
      else if (currentView === 'activity') renderActivity();
      else renderLibrary();
      document.querySelectorAll('[data-view]').forEach(button => {
        const isActive = button.dataset.view === currentView;
        button.classList.toggle('active', isActive);
        if (button.classList.contains('nav-button')) {
          if (isActive) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        }
      });
      document.querySelector('#profileName').textContent = profile?.name || 'Morgan';
      document.querySelector('#profileStatus').textContent = profile ? 'Steam profile' : 'Demo profile';
      document.querySelector('#avatar').textContent = (profile?.name || 'Morgan').slice(0, 1).toUpperCase();
    }

    function applySearch() {
      const input = document.querySelector('#gameSearch');
      const list = document.querySelector('#gameList');
      if (!input || !list) return;
      const query = input.value.trim().toLowerCase();
      let count = 0;
      list.querySelectorAll('.game-row').forEach(row => {
        const match = row.querySelector('h3').textContent.toLowerCase().includes(query);
        row.classList.toggle('hidden', !match);
        if (match) count += 1;
      });
      document.querySelector('#searchEmpty')?.classList.toggle('hidden', !query || count > 0);
    }

    function openConnectModal() {
      document.querySelector('#modalRoot').innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="connectTitle">
          <div class="modal-top"><div><span class="eyebrow">YOUR STEAM LIBRARY</span><h2 id="connectTitle">Connect your profile</h2></div><button class="close-button" type="button" aria-label="Close" data-close>&times;</button></div>
          <p>Enter a public Steam community profile name, profile URL, or SteamID64. Playlog only requests public profile data.</p>
          <form class="connect-form" id="connectForm"><label for="steamProfile">Steam profile name or URL</label><input id="steamProfile" name="profile" type="text" placeholder="e.g. steamcommunity.com/id/yourname" autocomplete="url" required><button class="primary-button" type="submit">Find my library</button><p class="form-message" id="formMessage" aria-live="polite"></p></form>
          <p class="privacy-note">No API key or Steam password is used. Playlog reads the most-played games included in your public Steam profile XML.</p>
        </section></div>`;
      document.querySelector('#steamProfile').focus();
      document.querySelector('#modalBackdrop').addEventListener('click', event => {
        if (event.target.id === 'modalBackdrop' || event.target.closest('[data-close]')) closeModal();
      });
      document.querySelector('#connectForm').addEventListener('submit', connectSteam);
    }

    function openAddGameModal() {
      document.querySelector('#modalRoot').innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="addGameTitle">
          <div class="modal-top"><div><span class="eyebrow">YOUR LIBRARY</span><h2 id="addGameTitle">Add a game</h2></div><button class="close-button" type="button" aria-label="Close" data-close>&times;</button></div>
          <p>Some games require an APK Key to be detected or added automatically. Check the game's requirements first; if it is missing from your list, add it here. Manually added games stay saved in this browser.</p>
          <form class="connect-form" id="addGameForm"><label for="manualGameName">Game name</label><input id="manualGameName" name="name" type="text" maxlength="80" placeholder="e.g. Another game" required><label for="manualGameHours">Hours played</label><input id="manualGameHours" name="hours" type="number" min="0" step="0.1" placeholder="0" required><label for="manualGameAppId">Steam app ID (optional)</label><input id="manualGameAppId" name="appid" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="For game artwork"><button class="primary-button" type="submit">Add to library</button><p class="form-message" id="formMessage" aria-live="polite"></p></form>
        </section></div>`;
      document.querySelector('#manualGameName').focus();
      document.querySelector('#modalBackdrop').addEventListener('click', event => {
        if (event.target.id === 'modalBackdrop' || event.target.closest('[data-close]')) closeModal();
      });
      document.querySelector('#addGameForm').addEventListener('submit', event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const name = String(form.get('name')).trim();
        const hours = Number(form.get('hours'));
        const requestedAppId = String(form.get('appid')).trim();
        if (!name || !Number.isFinite(hours) || hours < 0 || (requestedAppId && !/^\d+$/.test(requestedAppId))) {
          document.querySelector('#formMessage').textContent = 'Enter a game name, valid hours, and a numeric app ID if you use one.';
          return;
        }
        const existing = games.find(game => game.name.toLowerCase() === name.toLowerCase());
        const appid = requestedAppId || existing?.appid || `manual-${Date.now()}`;
        const game = { appid, name, hours, image: requestedAppId ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${requestedAppId}/header.jpg` : (existing?.image || ''), detail: 'Added manually' };
        if (existing) Object.assign(existing, game);
        else games.push(game);
        activePick = getRecommendation(activePick?.appid);
        saveProfile();
        closeModal();
        currentView = 'library';
        render();
      });
    }

    function closeModal() { document.querySelector('#modalRoot').innerHTML = ''; }

    function extractProfilePath(value) {
      const trimmed = value.trim();
      if (!trimmed) return '';
      try {
        const url = new URL(trimmed.includes('://') ? trimmed : `https://${trimmed}`);
        if (!/^(www\.)?steamcommunity\.com$/i.test(url.hostname)) return '';
        const parts = url.pathname.split('/').filter(Boolean);
        const type = parts[0]?.toLowerCase();
        if (type === 'id' || type === 'profiles') return parts[1] || '';
      } catch { return /^[a-zA-Z0-9_-]+$/.test(trimmed) ? trimmed : ''; }
      return /^[a-zA-Z0-9_-]+$/.test(trimmed) ? trimmed : '';
    }

    async function connectSteam(event) {
      event.preventDefault();
      const field = document.querySelector('#steamProfile');
      const message = document.querySelector('#formMessage');
      const profilePath = extractProfilePath(field.value);
      if (!profilePath) { message.textContent = 'Enter a Steam vanity name or a steamcommunity.com profile URL.'; return; }
      if (/^\d/.test(profilePath) && !/^\d{17}$/.test(profilePath)) { message.textContent = 'A SteamID64 must be exactly 17 digits. Remove extra characters after the number.'; return; }
      const submit = event.currentTarget.querySelector('button[type="submit"]');
      submit.disabled = true;
      submit.textContent = 'Looking for your library…';
      message.textContent = 'Checking public Steam profile data…';
      try {
        const profileType = /^\d{17}$/.test(profilePath) ? 'profiles' : 'id';
        const profileUrl = `https://steamcommunity.com/${profileType}/${encodeURIComponent(profilePath)}`;
        const profileResponse = await fetch(`${profileUrl}/?xml=1`);
        if (!profileResponse.ok) throw new Error('Steam could not load that profile. Check the name or profile URL.');
        const profileText = await profileResponse.text();
        const profileXml = new DOMParser().parseFromString(profileText, 'application/xml');
        const steamError = profileXml.querySelector('response error')?.textContent?.trim();
        if (steamError) throw new Error('Steam could not find that profile. Check the SteamID64; it must be exactly 17 digits.');
        if (profileXml.querySelector('parsererror') || !profileXml.querySelector('profile')) throw new Error('Steam did not return profile XML for that name.');
        const privacy = profileXml.querySelector('privacyState')?.textContent?.trim().toLowerCase();
        if (privacy !== 'public') throw new Error('That Steam profile is not public. Set your profile visibility to Public and try again.');

        const foundGames = Array.from(profileXml.getElementsByTagName('mostPlayedGame')).map(node => {
          const get = name => node.getElementsByTagName(name)[0]?.textContent?.trim() || '';
          const gameLink = get('gameLink');
          const appid = get('statsName') || gameLink.match(/\/app\/(\d+)/)?.[1] || '';
          const name = get('gameName');
          const hours = Number.parseFloat(get('hoursOnRecord')) || 0;
          const image = get('gameLogo') || get('gameIcon') || (appid ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${encodeURIComponent(appid)}/header.jpg` : '');
          return { appid, name, hours, image, detail: 'Most played on Steam' };
        }).filter(game => game.name && game.appid);
        if (!foundGames.length) throw new Error('This profile is public, but Steam returned no most-played games in its profile XML. Check Game details is Public and total playtime privacy is off. If those settings are already correct, Steam is not publishing game data for this profile; anonymous import cannot retrieve it without an API key.');
        games = foundGames.sort((a, b) => b.hours - a.hours).slice(0, 5);
        const steamName = profileXml.querySelector('steamID')?.textContent?.trim();
        profile = { name: steamName || profilePath, path: profilePath };
        activePick = getRecommendation(activePick?.appid);
        saveProfile();
        closeModal();
        currentView = 'library';
        render();
      } catch (error) {
        message.textContent = error.message || 'Could not load that library. Check the profile name and privacy settings.';
      } finally {
        const button = document.querySelector('#connectForm button[type="submit"]');
        if (button) { button.disabled = false; button.textContent = 'Find my library'; }
      }
    }

    document.addEventListener('click', event => {
      const viewButton = event.target.closest('[data-view]');
      if (viewButton) {
        currentView = viewButton.dataset.view;
        render();
        return;
      }
      if (event.target.closest('[data-connect]') || event.target.closest('#profileButton')) { openConnectModal(); return; }
      if (event.target.closest('[data-add-game]')) { openAddGameModal(); return; }
      const storeButton = event.target.closest('[data-store]');
      if (storeButton) window.open(`https://store.steampowered.com/app/${encodeURIComponent(storeButton.dataset.store)}/`, '_blank', 'noopener,noreferrer');
    });
    document.querySelector('#gameSearch').addEventListener('input', applySearch);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    render();
  </script>
</body>
</html>
